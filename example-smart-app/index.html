      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
    <div id='holder' >
      <h1>Patient Details are</h1>

      <h2>Patient Resource</h2>
      <table>
        <tr>
          <th>First Name:</th>
          <td id='fname'></td>
        </tr>
        <tr>

        </tr>

      </table>
      <br>
    <a href="launch-patient.html">

    <br><label for="html">Document Reference:</label><br>
    <pre><div id='docr'></div></pre>
    </div>
    <br>
    <div>  
    <pre><div id='j'></div></pre> 
    </div>
    <div>

    <h1>Fetch Patient Documents</h1>
    <button id="fetchDocuments">Fetch Documents</button>
    <pre id="output"></pre>

    <script>
        document.getElementById('fetchDocuments').addEventListener('click', function () {
            // Initialize the SMART on FHIR client
            FHIR.oauth2.ready()
                .then(client => {
                    // Fetch DocumentReference resources for the current patient
                    return client.request(`DocumentReference?patient=${client.patient.id}`, {
                        pageLimit: 10, // Limit the number of results
                        flat: true    // Simplify the response structure
                    });
                })
                .then(data => {
                    // Display the documents
                    const output = document.getElementById('output');
                    output.textContent = JSON.stringify(data, null, 2);
                    console.log('Documents:', data);

                    // Optionally, fetch the content of each document
                    data.forEach(documentRef => {
                        const documentUrl = documentRef.content[0].attachment.url;
                        fetch(documentUrl, {
                            headers: {
                                'Authorization': `Bearer ${client.state.tokenResponse.access_token}` // Include the access token
                            }
                        })
                        .then(response => response.blob())
                        .then(blob => {
                            // Handle the document (e.g., display or download)
                            const url = URL.createObjectURL(blob);
                            console.log('Document URL:', url);
                            // Example: Open the document in a new tab
                            window.open(url);
                        })
                        .catch(error => {
                            console.error('Error fetching document content:', error);
                        });
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });
    </script>

    <!-- Application-level javascript-->
    <script src='./src/js/poc.js'></script>

    <!-- FHIR Client JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

    <!-- Prevent session bleed caused by single threaded embedded browser and sessionStorage API -->
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script>
      extractData().then(
        //Display Patient Demographics and Observations if extractData was success
        function(p) {
          drawVisualization(p);
        },

        //Display 'Failed to call FHIR Service' if extractData failed
        function() {
          $('#loading').hide();
          $('#errors').html('<p> Failed to call FHIR Service </p>');
        }
      );
    </script>
