<!DOCTYPE html>
<html>
<head>
  <title>SMART Launch</title>
  <script>
    // Extract parameters from URL
    const params = new URLSearchParams(window.location.search);
    const launch = params.get('launch');
    const iss = params.get('iss');
    
    // Forward to your backend server
    window.location.href = `/backend-auth?launch=${encodeURIComponent(launch)}&iss=${encodeURIComponent(iss)}`;
  </script>
</head>
<body>
  <p>Redirecting to authorization server...</p>
</body>
</html>
